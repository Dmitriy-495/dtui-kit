# theme.yaml — конфигурация палитры dtui-kit (опционально).
#
# Каждое поле необязательно — незаполненные поля наследуют встроенные
# значения по умолчанию (см. theme.Load в коде). Значения цветов — те
# же строки, что принимает lipgloss.Color(...) напрямую: обычно
# ANSI 256-цветный код ("214") или hex ("#FFA500").

border: "214"       # фирменный оранжевый — рамки, акценты, заголовок
ok: "82"            # статус OK
warn: "226"         # статус WARNING
sos: "196"          # статус SOS/критично
data: "214"         # основной текст с данными
muted: "239"        # вспомогательный, приглушённый текст

banner_font: "standard"  # шрифт по умолчанию для banner.Render — см. banner.Fonts()
